  .kpi-value.amber{color:var(--amber)}

  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}

  .chart-container{position:relative}
  .chart-container.tall{height:300px}
  .chart-container.short{height:220px}
  .chart-container.xtall{height:380px}

    vertical-align:middle;
  }
  .data-table th:last-child{border-right:none}
  .data-table td{
    padding:10px 16px;

    border-right:1px solid var(--border);
    color:var(--text);

    white-space:nowrap;
  }

  .data-table tbody tr:last-child td{border-bottom:none}
  .data-table tbody tr:hover td{background:var(--surface2)}
  .data-table th.num{text-align:right}
  .num{text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .good{color:var(--green)}
  .accent-c{color:var(--accent)}
  .amb{color:var(--amber)}
  .tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
  .tag-promoted{background:#f59e0b22;color:var(--promoted);border:1px solid #f59e0b44}
  .tag-halo{background:#a78bfa22;color:var(--halo);border:1px solid #a78bfa44}

const fmtCK = n => n>=1000000 ? '$'+(n/1000000).toFixed(1)+'M' : n>=1000 ? '$'+(n/1000).toFixed(0)+'K' : '$'+fmt(n,0);
const fmtPct = (n,d=1) => (n===null||n===undefined) ? '—' : Number(n).toFixed(d)+'%';
const fmtX = (n,d=2) => (n===null||n===undefined) ? '—' : Number(n).toFixed(d)+'×';
const shortDate = s => { const d=new Date(s+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
const shortOrder = o => o.split(' - ')[0];
const esc = s => (s||'').replace(/</g,'&lt;');

const TABS = [
  {id:'overview', label:'📊 DSP Overview'},
  {id:'asin', label:'🏷️ ASIN Performance'},
  {id:'attribution', label:'🔗 Attribution'},
  {id:'funnel', label:'🎯 Audience & Exposure'},
  {id:'paths', label:'🛣️ Path to Conversion'},
  {id:'cart', label:'🛒 Cart Abandonment'},
];

const tabbar = $('tabbar');
TABS.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.textContent = t.label;
  btn.onclick = ()=> switchTab(t.id, btn);
  tabbar.appendChild(btn);
});
function switchTab(tab, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  $('tab-'+tab).classList.add('active');
  window.scrollTo({top:0});
}

const app = $('app');
app.innerHTML = TABS.map(t=>`<div id="tab-${t.id}" class="tab-content${t.id==='overview'?' active':''}"><div class="page" id="page-${t.id}"></div></div>`).join('');

        <tr><td><span style="color:var(--cyan);font-weight:700">DSP-Touched Paths</span></td><td class="num">${fmt(pg.DSP.unique_paths)}</td><td class="num">${fmt(pg.DSP.users)}</td><td class="num">${fmt(pg.DSP.converting)}</td><td class="num">${fmtPct(pg.DSP.conv_rate,2)}</td><td class="num good">${fmtC0(pg.DSP.revenue)}</td><td class="num">${fmtC(pg.DSP.rev_per_conv)}</td></tr>
        <tr><td><span style="color:var(--purple);font-weight:600">SB-Touched Paths</span></td><td class="num">${fmt(pg.SB.unique_paths)}</td><td class="num">${fmt(pg.SB.users)}</td><td class="num">${fmt(pg.SB.converting)}</td><td class="num">${fmtPct(pg.SB.conv_rate,2)}</td><td class="num good">${fmtC0(pg.SB.revenue)}</td><td class="num">${fmtC(pg.SB.rev_per_conv)}</td></tr>
      </tbody>
    </table></div>
    <div class="callout" style="border-left:3px solid ${crChange<0?'var(--red)':'var(--green)'};margin-top:12px">
      <strong style="color:var(--text)">📈 Key Finding:</strong> DSP-touched paths convert at <strong style="color:${crChange<0?'var(--red)':'var(--green)'}">${fmtPct(dspCR,2)}</strong> — ${crChange<0?`${Math.abs(crChange).toFixed(0)}% below`:`${crChange.toFixed(0)}% above`} the ${fmtPct(spCR,2)} SP-only rate — and produce ${pg.DSP.rev_per_conv > pg.SP.rev_per_conv && pg.DSP.rev_per_conv > pg.SB.rev_per_conv ? 'the highest revenue per converter of any path group' : `${fmtC(pg.DSP.rev_per_conv)} in revenue per converter`}.
    </div>
  </div>

  <div class="section">
    <div class="section-title">Top 12 Paths to Conversion — by Revenue (July 2026)</div>
    <div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>Rank</th><th>Path</th><th class="num">Total Users</th><th class="num">Converting</th><th class="num">Conv. Rate</th><th class="num">Revenue</th><th class="num">Rev/Converter</th></tr></thead>
      <tbody id="ptcTbody"></tbody>
    </table></div>
  </div>
  `;

  // DSP Impact matched-pairs table — data pulled directly from July PTC-Full Path report
  const spBaselineCR = pg.SP.conv_rate;
  const dspImpactRows = [
    ['SP',                          'SP Only',        391860, 25,   0.006, 427.33,   17.09],
    ['SP → DSP',                    'SP + DSP',       2474,   2,    0.081, 35.97,    17.99],
    // ---
    ['SP → SP',                     'SP Only',        147847, 22,   0.015, 382.20,   17.37],
    ['DSP → SP',                    'SP + DSP (first)',2216,  2,    0.090, 35.98,    17.99],
    // ---
    ['SP → SP → SP',                'SP Only',        68191,  29,   0.042, 475.35,   16.39],
    ['SP → SP → SP → DSP',          'SP + DSP (end)', 701,    2,    0.285, 31.27,    15.64],
    // ---
    ['SP → SP → SP → SP',           'SP Only',        43463,  14,   0.032, 258.63,   18.47],
    ['DSP → SP → SP → SP',          'SP + DSP (first)',421,   2,    0.475, 17.96,    8.98],
    // ---
    ['SP → SP → SP → SP → SP',      'SP Only (×5)',   214352, 3441, 1.605, 72445.92, 21.05],
    ['DSP → SP → SP → SP → SP',     'DSP First Touch',3603,   203,  5.634, 4960.38,  24.44],
    ['DSP → DSP → DSP → SP → SP',   'DSP×3 First Touch',2590, 255,  9.846, 6039.56,  23.68],
    // ---
    ['(Any SP path)',  'SP-Only Aggregate',    pg.SP.users,  pg.SP.converting,  pg.SP.conv_rate,  pg.SP.revenue,  pg.SP.rev_per_conv],
    ['(Any DSP path)', 'DSP-Touched Aggregate',pg.DSP.users, pg.DSP.converting, pg.DSP.conv_rate, pg.DSP.revenue, pg.DSP.rev_per_conv],
  ];

  const dspImpactTbody = $('dspImpactTbody');
  dspImpactRows.forEach((row, i) => {
    const [path, type, users, converting, cr, revenue, rpc] = row;
    const isDSP = type.includes('DSP') || type.includes('Aggregate');
    const isAggregate = type.includes('Aggregate');

    let delta = '';
    if (isDSP && !isAggregate) {
      const pairedCR = dspImpactRows[i-1] ? dspImpactRows[i-1][4] : spBaselineCR;
      const pct = ((cr - pairedCR) / pairedCR * 100);
      const good = pct >= 0;
      delta = `<span style="color:${good?'var(--green)':'var(--red)'};font-weight:700">${pct>=0?'+':''}${pct.toFixed(0)}%</span>`;
    } else if (isAggregate && isDSP) {
      const pct = ((cr - spBaselineCR) / spBaselineCR * 100);
      const good = pct >= 0;
      delta = `<span style="color:${good?'var(--green)':'var(--red)'};font-weight:700">${pct>=0?'+':''}${pct.toFixed(0)}% vs SP-only</span>`;
    } else if (isAggregate) {
      delta = '<span style="color:var(--muted)">baseline</span>';
    }

    const rowBg = isAggregate ? 'background:var(--surface2)' : '';
    const pathStyle = isDSP ? `font-family:monospace;font-size:11px;color:${C};font-weight:600` : `font-family:monospace;font-size:11px;color:${MU}`;
    const typeTag = isDSP
      ? `<span style="font-size:10px;font-weight:700;color:${C};background:#22d3ee18;border:1px solid #22d3ee44;border-radius:10px;padding:2px 7px">${type}</span>`
      : `<span style="font-size:10px;font-weight:600;color:${MU};background:#7a8aaa18;border:1px solid #7a8aaa33;border-radius:10px;padding:2px 7px">${type}</span>`;
    const isPairStart = (i===0||i===2||i===4||i===6||i===8);
    const borderTop = (isPairStart && i>0) ? 'border-top:2px solid var(--border)' : '';

    dspImpactTbody.insertAdjacentHTML('beforeend', `<tr style="${rowBg};${borderTop}">
      <td style="${pathStyle}">${path}</td>
      <td>${typeTag}</td>
      <td class="num">${fmt(users)}</td>
      <td class="num">${fmt(converting)}</td>
      <td class="num ${isDSP?'good':''}">${cr.toFixed(2)}%</td>
      <td class="num good">${fmtC0(revenue)}</td>
      <td class="num">${fmtC(rpc)}</td>
      <td class="num">${delta}</td>
    </tr>`);
  });

  DATA.top12_paths.forEach((p,i)=>{
    const hasDSP = p.path.includes('DSP');
    $('ptcTbody').insertAdjacentHTML('beforeend', `<tr><td style="font-weight:700;color:${MU}">#${i+1}</td><td style="font-family:monospace;font-size:11px;color:${hasDSP?C:MU}">${p.path}</td><td class="num">${fmt(p.users)}</td><td class="num">${fmt(p.converting)}</td><td class="num ${p.conv_rate*100>3?'good':''}">${fmtPct(p.conv_rate*100,2)}</td><td class="num good">${fmtC0(p.revenue)}</td><td class="num">${p.rev_per_conv?fmtC(p.rev_per_conv):'—'}</td></tr>`);
  });
  new Chart($('cPtcCR'), {type:'bar', data:{labels:['SP Only','DSP-Touched','SB-Touched'], datasets:[{label:'Conv. Rate %', data:[spCR,dspCR,sbCR], backgroundColor:['#7a8aaa44','#22d3ee66','#a78bfa66'], borderColor:[MU,C,P], borderWidth:2}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`Conv. Rate: ${c.raw.toFixed(2)}%`}}}, scales:{y:{grid:{color:'#252f4566'}, ticks:{callback:v=>v+'%'}, beginAtZero:true}}}});
  new Chart($('cPtcRPC'), {type:'bar', data:{labels:['SP Only','DSP-Touched','SB-Touched'], datasets:[{label:'Rev per Converter ($)', data:[pg.SP.rev_per_conv,pg.DSP.rev_per_conv,pg.SB.rev_per_conv], backgroundColor:['#7a8aaa44','#22d3ee66','#a78bfa66'], borderColor:[MU,C,P], borderWidth:2}]}, options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`$${c.raw.toFixed(2)}`}}}, scales:{y:{grid:{color:'#252f4566'}, ticks:{callback:v=>'$'+v}}}}});
  } catch(e){ console.error("Section render error:", e); }
})();

// ============================================================
// TAB 6: CART ABANDONMENT
// ============================================================
(function(){
  try{
  const ca = DATA.cart_abandonment;
  if(!ca){ return; }
  const page = $('page-cart');
  const s1 = ca.section1_all;
  const s2 = ca.section2_dsp;
  const best = s1.reduce((a,b)=> a.cart_abandonment_rate_pct < b.cart_abandonment_rate_pct ? a : b);
  const worst = s1.reduce((a,b)=> a.cart_abandonment_rate_pct > b.cart_abandonment_rate_pct ? a : b);
  const bestDsp = s2.reduce((a,b)=> a.cart_abandonment_rate_pct < b.cart_abandonment_rate_pct ? a : b, s2[0]);
  const worstDsp = s2.reduce((a,b)=> a.cart_abandonment_rate_pct > b.cart_abandonment_rate_pct ? a : b, s2[0]);
  const topDspByAtc = [...s2].sort((a,b)=>b.atc_unique_users - a.atc_unique_users)[0];

  function rateColor(r){ return r>=60 ? R : r<=45 ? G : AM; }
  function rateStatus(r){ return r>=60 ? 'High Risk' : r<=45 ? 'Strong' : 'Moderate'; }

  page.innerHTML = `
  <div class="insight-grid">
    <div class="insight-card a"><div class="il">Avg Abandonment Rate</div><div class="iv amber">${ca.avg_abandon_all.toFixed(1)}%</div><div class="id">Across top 15 parent ASINs by ATC volume — all tracked products</div></div>
    <div class="insight-card g"><div class="il">Best Performer</div><div class="iv green">${best.cart_abandonment_rate_pct.toFixed(1)}%</div><div class="id">${best.parent_asin} — lowest abandonment: ${fmt(best.purchase_unique_users)} of ${fmt(best.atc_unique_users)} ATC users converted</div></div>
    <div class="insight-card r"><div class="il">Recovery Opportunity</div><div class="iv" style="color:var(--red);font-size:18px">${worst.parent_asin}</div><div class="id">${fmt(worst.atc_unique_users)} ATC users, only ${(100-worst.cart_abandonment_rate_pct).toFixed(1)}% converted — ${worst.cart_abandonment_rate_pct.toFixed(1)}% abandonment rate</div></div>
  </div>

  <div class="section">
    <div class="section-title">Section 1 — All Tracked ASINs: Cart Abandonment Rate by Parent ASIN (Top 15 by ATC Volume)</div>
    <div class="section-title" style="margin-top:0">Detail Table: Top 15 ASINs (All Tracked)</div>
    <div class="data-table-wrap"><table class="data-table">
      <thead><tr><th>Rank</th><th>Parent ASIN</th><th class="num">ATC Users</th><th class="num">Purchase Users</th><th class="num">Abandon Rate %</th><th>Status</th></tr></thead>
      <tbody id="cartS1Tbody"></tbody>
    </table></div>
    <div class="callout" style="border-left:3px solid var(--cyan);margin-top:14px"><strong style="color:var(--text)">💡 Opportunity:</strong> ASINs with abandonment rates above 60% are prime candidates for DSP cart-abandonment retargeting campaigns.</div>
  </div>

  <div class="section">
    <div class="section-title">Section 2 — DSP-Advertised ASINs Only</div>
    <div class="callout" style="border-left:3px solid var(--purple);margin-bottom:14px"><strong style="color:var(--text)">🔗 Scope:</strong> Filtered to the <strong style="color:var(--purple)">${ca.dsp_parent_count} parent ASINs</strong> that were directly advertised through DSP during July (cross-referenced with the ASIN Performance tab).</div>
    <div class="insight-grid">
      <div class="insight-card"><div class="il">DSP-Advertised Avg Rate</div><div class="iv accent-c">${ca.avg_abandon_dsp.toFixed(1)}%</div><div class="id">Across all ${ca.dsp_parent_count} DSP-advertised ASINs</div></div>
      <div class="insight-card"><div class="il">Top DSP ASIN by ATC</div><div class="iv" style="font-size:16px">${topDspByAtc.parent_asin}</div><div class="id">${esc(topDspByAtc.product_name.split(' - ').slice(0,2).join(' - ') || topDspByAtc.product_name.slice(0,40))} — ${fmt(topDspByAtc.atc_unique_users)} ATC users, ${topDspByAtc.cart_abandonment_rate_pct.toFixed(1)}% abandonment</div></div>
      <div class="insight-card r"><div class="il">Highest-Risk DSP ASIN</div><div class="iv" style="color:var(--red);font-size:16px">${worstDsp.parent_asin}</div><div class="id">${esc(worstDsp.product_name.split(' - ').slice(0,2).join(' - ') || worstDsp.product_name.slice(0,40))} — ${worstDsp.cart_abandonment_rate_pct.toFixed(1)}% abandonment, weakest converter</div></div>
    </div>
    <div class="chart-card full"><div class="chart-title">Cart Abandonment Rate — DSP-Advertised ASINs by ATC Volume</div><div class="chart-container xtall"><canvas id="cCartS2"></canvas></div></div>
    <div class="data-table-wrap" style="margin-top:16px"><table class="data-table">
      <thead><tr><th>Rank</th><th>ASIN</th><th>Product Name</th><th class="num">ATC Users</th><th class="num">Purchase Users</th><th class="num">Abandon Rate %</th><th>Status</th></tr></thead>
      <tbody id="cartS2Tbody"></tbody>
    </table></div>
    <div class="callout" style="border-left:3px solid ${Math.abs(ca.avg_abandon_dsp-ca.avg_abandon_all)<3?'var(--muted)':'var(--amber)'};margin-top:14px">
      <strong style="color:var(--text)">📊 Takeaway:</strong> DSP-advertised products show ${Math.abs(ca.avg_abandon_dsp-ca.avg_abandon_all)<3?'a similar':'a different'} abandonment rate (${ca.avg_abandon_dsp.toFixed(1)}%) ${Math.abs(ca.avg_abandon_dsp-ca.avg_abandon_all)<3?'to':'versus'} the broader catalog (${ca.avg_abandon_all.toFixed(1)}%)${Math.abs(ca.avg_abandon_dsp-ca.avg_abandon_all)<3?", indicating DSP-driven traffic does not carry meaningfully different purchase intent at the cart stage. The opportunity lies upstream — driving more ATC volume via DSP, since conversion rates downstream of cart are stable.":'.'}
    </div>
  </div>
  `;

  s1.forEach((r,i)=>{
    $('cartS1Tbody').insertAdjacentHTML('beforeend', `<tr><td class="rank" style="font-weight:700;color:${MU}">#${i+1}</td><td style="font-family:monospace;font-size:11px;color:${C}">${r.parent_asin}</td><td class="num">${fmt(r.atc_unique_users)}</td><td class="num good">${fmt(r.purchase_unique_users)}</td><td class="num" style="color:${rateColor(r.cart_abandonment_rate_pct)};font-weight:700">${r.cart_abandonment_rate_pct.toFixed(1)}%</td><td><span class="tag" style="color:${rateColor(r.cart_abandonment_rate_pct)};background:${rateColor(r.cart_abandonment_rate_pct)}22;border:1px solid ${rateColor(r.cart_abandonment_rate_pct)}44">${rateStatus(r.cart_abandonment_rate_pct)}</span></td></tr>`);
  });
  s2.forEach((r,i)=>{
    $('cartS2Tbody').insertAdjacentHTML('beforeend', `<tr><td class="rank" style="font-weight:700;color:${MU}">#${i+1}</td><td style="font-family:monospace;font-size:11px;color:${P};font-weight:600">${r.parent_asin}</td><td class="prod-cell" style="font-size:11px">${esc(r.product_name)}</td><td class="num">${fmt(r.atc_unique_users)}</td><td class="num good">${fmt(r.purchase_unique_users)}</td><td class="num" style="color:${rateColor(r.cart_abandonment_rate_pct)};font-weight:700">${r.cart_abandonment_rate_pct.toFixed(1)}%</td><td><span class="tag" style="color:${rateColor(r.cart_abandonment_rate_pct)};background:${rateColor(r.cart_abandonment_rate_pct)}22;border:1px solid ${rateColor(r.cart_abandonment_rate_pct)}44">${rateStatus(r.cart_abandonment_rate_pct)}</span></td></tr>`);
  });

  new Chart($('cCartS2'), {type:'bar', data:{
    labels: s2.map(r=>r.parent_asin),
    datasets:[{label:'Abandonment Rate %', data:s2.map(r=>r.cart_abandonment_rate_pct), backgroundColor:s2.map(r=>rateColor(r.cart_abandonment_rate_pct)+'88'), borderColor:s2.map(r=>rateColor(r.cart_abandonment_rate_pct)), borderWidth:1}]
  }, options:{indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.raw.toFixed(1)}%`}}}, scales:{x:{grid:{color:'#252f4566'}, ticks:{callback:v=>v+'%'}, max:100}}}});
  } catch(e){ console.error("Section render error:", e); }
})();
</script>
</body>
